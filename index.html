<!DOCTYPE html>
<html lang="ru">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#7c3aed"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <title>
    Медицинский опросник
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

</head>
<body>

<div class="container">

  <!-- HEADER -->

  <div class="header">

    <h1>
      🩺 Медицинский опросник
    </h1>

    <p>
      «Что я знаю о клещевом энцефалите?»
    </p>

  </div>

  <!-- QUIZ CARD -->

  <div
    class="card"
    id="quizCard"
  >

    <!-- TOP -->

    <div class="progress-top">

      <span id="questionNumber">
        Вопрос 1 / 10
      </span>

      <span id="progressPercent">
        10%
      </span>

    </div>

    <!-- PROGRESS -->

    <div class="progress">

      <div
        class="progress-bar"
        id="progressBar"
      ></div>

    </div>

    <!-- QUIZ -->

    <div id="quiz"></div>

    <!-- BUTTON -->

    <button
      class="next-btn"
      id="nextBtn"
    >
      Следующий вопрос
    </button>

  </div>

  <!-- RESULT -->

  <div
    class="result-card hidden"
    id="resultCard"
  >

    <div class="success">
      ✓
    </div>

    <h2>
      Тест завершён
    </h2>

    <p id="scoreText"></p>

    <div id="level"></div>

    <button
      class="restart-btn"
      onclick="restartQuiz()"
    >
      Пройти снова
    </button>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
